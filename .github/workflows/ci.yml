name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.9.0
      - run: npm ci --ignore-scripts
      - name: Validate curriculum bundle and ID history
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trap 'rm -f .t004-prior-registry.json' EXIT
          previous_ref="$EVENT_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            previous_ref="$(git rev-parse "${PR_HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -n "$previous_ref" ]] && git cat-file -e "$previous_ref:content/curriculum-id-registry.json" 2>/dev/null; then
            git show "$previous_ref:content/curriculum-id-registry.json" > .t004-prior-registry.json
          fi
          npm run validate:curriculum
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - name: Run tests with machine-readable evidence
        run: |
          mkdir -p .ci-reports
          npm test -- --reporter=json --reporter=default --outputFile.json=.ci-reports/vitest.json
      - run: npm run test:property
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate non-empty Vitest evidence
        if: always()
        run: node scripts/validate-vitest-evidence.mjs .ci-reports/vitest.json
      - name: Check test integrity with Overlock
        if: always()
        uses: rxova/overlock@9b3323d5dc4df767d544a72c05a156adea1dcbc6 # v0.10.4
        with:
          version: '0.10.4'
          cli-path: ${{ github.workspace }}/node_modules/overlock/dist/cli.js
          fail-on: high
          comment: 'false'
      - name: Identify changed Jest/Vitest-style unit tests
        id: changed_unit_tests
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/$BASE_REF"
          elif [[ -n "${EVENT_BEFORE:-}" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base_ref="$EVENT_BEFORE"
          else
            base_ref="HEAD^"
          fi
          git diff --name-only --diff-filter=ACMRT -z "$base_ref...HEAD" > "$RUNNER_TEMP/testtrust-changed-files"
          mapfile -d '' -t all_changed_files < "$RUNNER_TEMP/testtrust-changed-files"
          changed_unit_tests=()
          for path in "${all_changed_files[@]}"; do
            case "$path" in
              tests/e2e/*) continue ;;
            esac
            if [[ "$path" =~ ^(src|tests)/.*\.test\.[cm]?[jt]sx?$ ]]; then
              changed_unit_tests+=("$path")
            fi
          done
          : > "$RUNNER_TEMP/testtrust-changed-tests"
          if ((${#changed_unit_tests[@]} > 0)); then
            printf '%s\0' "${changed_unit_tests[@]}" > "$RUNNER_TEMP/testtrust-changed-tests"
          fi
          echo "count=${#changed_unit_tests[@]}" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          if ((${#changed_unit_tests[@]} == 0)); then
            echo 'has_tests=false' >> "$GITHUB_OUTPUT"
            echo 'No changed Jest/Vitest-style unit tests; TestTrust will be skipped.'
          else
            echo 'has_tests=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out TestTrust source at the reviewed commit
        if: ${{ always() && steps.changed_unit_tests.outputs.has_tests == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: corgu1995/testtrust
          ref: 5f468c50285cab751f7756f76e4b8f305c50e2de # v0.1.9
          path: .integrity-tools/testtrust-${{ github.run_id }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check changed unit tests with TestTrust
        if: ${{ always() && steps.changed_unit_tests.outputs.has_tests == 'true' }}
        env:
          TESTTRUST_BASE_REF: ${{ steps.changed_unit_tests.outputs.base_ref }}
          TESTTRUST_EXPECTED_FILES: ${{ steps.changed_unit_tests.outputs.count }}
          TESTTRUST_DIR: ${{ github.workspace }}/.integrity-tools/testtrust-${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$TESTTRUST_DIR"' EXIT
          mapfile -d '' -t changed_unit_tests < "$RUNNER_TEMP/testtrust-changed-tests"
          if ((${#changed_unit_tests[@]} != TESTTRUST_EXPECTED_FILES)); then
            echo '::error::Changed test list does not match its recorded file count'
            exit 1
          fi
          (
            cd "$TESTTRUST_DIR"
            npm ci --ignore-scripts
            npm run build
          )
          report_path="$RUNNER_TEMP/testtrust-report.json"
          stderr_path="$RUNNER_TEMP/testtrust-stderr.log"
          set +e
          node "$TESTTRUST_DIR/bin/testtrust.mjs" \
            --base "$TESTTRUST_BASE_REF" \
            --format json \
            --fail-under 60 \
            "${changed_unit_tests[@]}" > "$report_path" 2> "$stderr_path"
          cli_status=$?
          set -e
          cat "$stderr_path" >&2
          if ((cli_status != 0)); then
            echo "::error::TestTrust CLI failed with exit code $cli_status"
            exit "$cli_status"
          fi
          node scripts/validate-testtrust-report.mjs \
            "$report_path" \
            "$TESTTRUST_BASE_REF" \
            "${#changed_unit_tests[@]}" \
            "$cli_status" \
            60
          rm -rf "$TESTTRUST_DIR"
      - name: Check merge evidence without rerunning Vitest
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: axigatelabs/merge-evidence-gate@bee226c890ee0115ab8222c2f1c0262c176df8c2 # v0.11.0
        with:
          agents-only: 'true'
          fail-on: needs-human
          evidence: report
          report-path: .ci-reports/vitest.json
          report-format: vitest
          report-command: npm test -- --reporter=json --reporter=default --outputFile.json=.ci-reports/vitest.json
          comment: 'false'
          upload-receipt: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: synthetic-test-failure-${{ github.sha }}
          path: |
            .ci-reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

# No production secrets, privileged PR triggers, publishing, deployment or migrations.
# Branch protection and an actual remote run remain separately verified operator gates.
